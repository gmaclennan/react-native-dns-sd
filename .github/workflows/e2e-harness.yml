name: E2E Harness NSD Tests

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  ANDROID_AVD_HOME: /home/runner/.config/.android/avd

jobs:
  cross-emulator-harness:
    name: RN Harness cross-emulator NSD
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: android-actions/setup-android@v3

      - name: Add Android tools to PATH
        shell: bash
        run: |
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: e2e-harness
        shell: bash
        run: npm install

      - name: Generate Android project (Expo prebuild)
        working-directory: e2e-harness
        shell: bash
        run: npx expo prebuild --platform android --clean

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install system image & create AVDs
        shell: bash
        run: |
          echo "y" | sdkmanager --install "system-images;android-30;default;x86_64"
          echo "no" | avdmanager create avd -n avd1 \
            -k "system-images;android-30;default;x86_64" --force
          echo "no" | avdmanager create avd -n avd2 \
            -k "system-images;android-30;default;x86_64" --force

      - name: Start emulators with QEMU socket multicast
        shell: bash
        run: |
          emulator @avd1 -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot \
            -qemu -device virtio-net-pci,netdev=lan,mac=52:54:00:12:34:56 \
            -netdev socket,id=lan,mcast=230.0.0.1:1234 \
            >emu1.log 2>&1 &

          sleep 5

          emulator @avd2 -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot \
            -qemu -device virtio-net-pci,netdev=lan,mac=52:54:00:12:34:57 \
            -netdev socket,id=lan,mcast=230.0.0.1:1234 \
            >emu2.log 2>&1 &

      - name: Wait for boot & configure networking
        shell: bash
        run: |
          for serial in emulator-5554 emulator-5556; do
            echo "Waiting for $serial..."
            timeout 300 adb -s "$serial" wait-for-device
            while [ "$(adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]; do
              sleep 5
            done
            echo "$serial booted"
          done

          adb -s emulator-5554 root
          adb -s emulator-5556 root
          sleep 2

          # Configure shared NIC
          for serial_ip in "emulator-5554 192.168.77.10" "emulator-5556 192.168.77.11"; do
            serial=${serial_ip%% *}
            ip=${serial_ip##* }
            adb -s "$serial" shell "ip link set eth1 up"
            adb -s "$serial" shell "ip addr add $ip/24 dev eth1"
            adb -s "$serial" shell "ip rule add from all lookup main pref 99" 2>/dev/null || true
            adb -s "$serial" shell "ip link set wlan0 down" 2>/dev/null || true
            adb -s "$serial" shell "ip link set radio0 down" 2>/dev/null || true
          done

          echo "=== Network configured ==="
          adb devices -l
          sleep 5

      - name: Verify harness setup
        working-directory: e2e-harness
        shell: bash
        run: |
          echo "=== Working directory ==="
          pwd
          echo "=== Node/npm versions ==="
          node --version
          npm --version
          echo "=== Harness binary ==="
          npx react-native-harness --version 2>&1 || echo "harness --version failed"
          echo "=== Android project ==="
          ls -la android/ 2>/dev/null || echo "No android/ directory!"
          ls -la android/app/build.gradle 2>/dev/null || echo "No app/build.gradle!"
          echo "=== Config files ==="
          cat rn-harness.config.mjs
          echo "=== ADB devices ==="
          adb devices -l

      - name: Run NSD tests in parallel
        working-directory: e2e-harness
        shell: bash
        run: |
          set +e

          echo "=== Starting advertise test on emu2 ==="
          npx react-native-harness --harnessRunner emu2 \
            tests/advertise.harness.ts \
            > /tmp/emu2-output.txt 2>&1 &
          EMU2_PID=$!

          # Give emu2 time to build, install, and start publishing
          sleep 30

          echo "=== Starting discover test on emu1 ==="
          npx react-native-harness --harnessRunner emu1 \
            tests/discover.harness.ts \
            > /tmp/emu1-output.txt 2>&1
          EMU1_EXIT=$?

          # Wait for emu2
          wait $EMU2_PID
          EMU2_EXIT=$?

          echo ""
          echo "=== Emu1 (discover) exit: $EMU1_EXIT ==="
          cat /tmp/emu1-output.txt
          echo ""
          echo "=== Emu2 (advertise) exit: $EMU2_EXIT ==="
          cat /tmp/emu2-output.txt

          # Fail if either test failed
          [ $EMU1_EXIT -eq 0 ] && [ $EMU2_EXIT -eq 0 ]

      - name: Collect logs
        if: always()
        shell: bash
        run: |
          echo "=== Emu1 harness output ==="
          cat /tmp/emu1-output.txt 2>/dev/null || echo "(not found)"
          echo ""
          echo "=== Emu2 harness output ==="
          cat /tmp/emu2-output.txt 2>/dev/null || echo "(not found)"
          echo ""
          echo "=== Emulator logcat ==="
          for serial in emulator-5554 emulator-5556; do
            echo "--- $serial ---"
            timeout 30 adb -s "$serial" logcat -d -s "DnsSdModule:*" "NsdManager:*" "ReactNativeJS:*" "AndroidRuntime:*" 2>/dev/null | tail -100 || true
          done

      - name: Post diagnostics as PR comment
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## RN Harness CI diagnostics (run ${{ github.run_number }})"
            echo ""
            for f in /tmp/emu1-output.txt /tmp/emu2-output.txt $GITHUB_WORKSPACE/emu1.log $GITHUB_WORKSPACE/emu2.log; do
              echo "### $(basename $f)"
              echo '```'
              if [ -f "$f" ]; then tail -c 3000 "$f"; else echo "(not found)"; fi
              echo '```'
              echo ""
            done
          } > /tmp/pr-comment.md

          gh pr comment 1 --repo "${{ github.repository }}" --body-file /tmp/pr-comment.md || {
            echo "Failed to post PR comment, dumping content:"
            cat /tmp/pr-comment.md
          }

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          for serial in emulator-5554 emulator-5556; do
            adb -s "$serial" emu kill 2>/dev/null || true
          done
